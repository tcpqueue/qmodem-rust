# 服务管理与模组业务共用此配置。首次部署后按设备实际情况修改。
version = 1

[server]
listen = "127.0.0.1"
port = 8088
# Linux 网络设备，如 br-lan、eth0；空字符串表示不限制网卡。
interface = ""

[logging]
# off / error / warn / info / debug / trace
level = "info"
# text / json；输出到 stderr，由 procd 收集至系统日志。
format = "text"

[auth]
# qmodemd init-auth 生成访问令牌并仅保存 SHA-256。非回环监听必须配置认证。
token_hash = ""

[storage]
sqlite = "/etc/qmodem-rust/data.sqlite3"

